version: '3.9'

services:
  web:
    image: vladshmit1992/coursework:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: materials
    command:
      bash -c "python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - ./.env.docker
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      - db
      - redis
    networks:
      - app_network

  db:
    image: postgres:16
    env_file:
      - .env.docker
    # хранилище для БД, чтобы БД каждый раз не пересоздавалась
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    env_file:
      - .env.docker
    healthcheck:
      test: redis-cli ping
      interval: 3s
      timeout: 3s
      retries: 5


  celery:
    image: vladshmit1992/coursework-celery
    build:
      context: .
    container_name: celery_worker
    command:
      celery -A config worker -l INFO
    env_file:
      - ./.env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery_beat:
    image: vladshmit1992/coursework-celery-beat
    build:
      context: .
    container_name: celery_beat
    command:
      celery -A config beat --loglevel=INFO
    env_file:
      - ./.env.docker
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - celery

  nginx:
    image: vladshmit1992/coursework-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - app_network

networks:
    app_network:
        driver: bridge

volumes:
  postgres_data:
  django_static:
  redis_data:
  static_volume: